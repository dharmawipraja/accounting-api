name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs group by ref, so a new push to the PR supersedes (cancels) the old run.
  # Pushes group by COMMIT SHA: CD's ci-gate needs a SUCCESSFUL push-to-main run
  # for the exact commit it deploys, and a ref-wide group would not be enough
  # even with cancel-in-progress off — GitHub keeps only ONE pending run per
  # group and silently cancels an older queued one when a newer push arrives,
  # leaving that commit undeployable. One group per SHA means queued pushes
  # never displace each other.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
      - run: npm run typecheck
      - run: npm run lint:ci
      - run: npm run test:cov:all # unit-cov + e2e-cov + nyc merge + check-coverage (the merged 90/86/90/90 defect-guard gate)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage-e2e/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # shellcheck is preinstalled on ubuntu runners. Covers every committed shell
      # script, incl. scripts/deploy-remote.sh (the exact commands CD runs on the
      # VM over SSH — cd.yml sends that file, so there is no inline copy to drift).
      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build production image
        run: docker build -t accounting-api:ci .
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: accounting-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The migrate image (Dockerfile `build` stage: prisma CLI + migrations +
  # scripts/db; npm/npx stripped like the runtime image) is what CD's
  # one-shot `migrate` service runs against prod — same pinned action and scan
  # policy as the runtime image. Its own job so each image's result is separate.
  docker-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build migrate image
        run: docker build --target build -t accounting-api-migrate:ci .
      - name: Scan migrate image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: accounting-api-migrate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

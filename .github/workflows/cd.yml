name: CD

on:
  # Manual only. In the GitHub Actions UI: open this workflow → "Run workflow" →
  # pick the tag (or branch) from the ref dropdown → Run. It builds/deploys that
  # ref; it does NOT run automatically on push to main.
  #
  # Gated on CI: the `ci-gate` job refuses to build/deploy a commit unless the CI
  # workflow (ci.yml) has a SUCCESSFUL *push-to-main* run for that exact commit
  # SHA — a green PR run for an unmerged head does NOT qualify. So only commits
  # that landed on main (or tags cut from them) can be released. Pair this with
  # a GitHub Environment + deployment branch policy (see deploy.md §CD).
  workflow_dispatch:

concurrency:
  # ONE global group: there is a single production host, so two deploys of
  # different refs (e.g. a tag and main) must never run at the same time.
  # Queued, never cancelled mid-deploy.
  group: cd-deploy
  cancel-in-progress: false

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # event=push&branch=main: only CI runs for a push to main count, so a
          # PR head (or any branch) that never merged cannot pass the gate.
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&event=push&branch=main&per_page=1" --jq '.total_count')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::CI has no successful push-to-main run for $SHA — refusing to build/deploy. Merge to main and let CI pass first."
            exit 1
          fi
          echo "CI passed on main for $SHA ($n successful run(s))."

  push:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      migrate_image: ${{ steps.names.outputs.migrate_image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # GHCR repository names must be lowercase; github.repository may not be.
      # A ref name may contain `/` (e.g. release/1.2) or other characters that
      # are invalid in a Docker tag: map everything outside [A-Za-z0-9_.-] to
      # `-` (tags are also capped at 128 chars).
      - id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref_tag=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          {
            echo "repo=$repo"
            echo "ref_tag=$ref_tag"
            echo "api_image=$repo:${GITHUB_SHA}"
            echo "migrate_image=$repo-migrate:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Runtime image (Dockerfile `production` stage) → the `api` service.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.names.outputs.repo }}:${{ steps.names.outputs.ref_tag }}
            ${{ steps.names.outputs.repo }}:${{ github.sha }}
            ${{ steps.names.outputs.repo }}:latest
      # Migrate image (Dockerfile `build` stage: has the prisma CLI + migrations +
      # scripts/db) → the one-shot `migrate` service.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: build
          push: true
          tags: |
            ${{ steps.names.outputs.repo }}-migrate:${{ steps.names.outputs.ref_tag }}
            ${{ steps.names.outputs.repo }}-migrate:${{ github.sha }}
            ${{ steps.names.outputs.repo }}-migrate:latest
  # Deploy is gated on a repository VARIABLE, not on a secret: the `secrets`
  # context is not allowed in a job-level `if:`, and a separate job that probes
  # the secret would need `environment: production` too — otherwise it only sees
  # REPO secrets and, once the DEPLOY_SSH_* secrets live in the Environment (as
  # they should), it reports "no secret" and deploy is silently skipped. `vars`
  # IS allowed in a job-level `if:` and is visible to every job, so the switch is
  # explicit: set repo variable DEPLOY_ENABLED=true to activate; anything else
  # (unset) keeps CD publish-only. The DEPLOY_SSH_* / DEPLOY_PATH secrets live in
  # the `production` Environment and are released only to this job, and only
  # for refs its deployment branch/tag policy allows (see deploy.md §CD).
  deploy:
    needs: [push]
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Immutable per-commit tags pushed above; docker-compose.prod.yml reads
          # these for the `api` / `migrate` services' `image:`.
          API_IMAGE: ${{ needs.push.outputs.api_image }}
          MIGRATE_IMAGE: ${{ needs.push.outputs.migrate_image }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_IMAGE,MIGRATE_IMAGE,DEPLOY_SHA,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            # Keep the compose files / Caddyfile / scripts in step with the images.
            # PREV_SHA = what the VM ran before, for the bind-mount refresh below.
            PREV_SHA=""
            if [ -d .git ]; then
              PREV_SHA=$(git rev-parse HEAD)
              git fetch --quiet origin
              git checkout --quiet --detach "$DEPLOY_SHA"
            fi
            export API_IMAGE MIGRATE_IMAGE
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            # Pull the images CI just pushed, then start WITHOUT building so the
            # host never runs a stale locally-built image.
            $COMPOSE pull
            # Stop the OLD api before migrate runs: old code against the new
            # schema can hit new CHECKs/triggers (e.g. a void without voided_on
            # -> 500). up then runs migrate to completion and starts the new api.
            $COMPOSE stop api
            $COMPOSE up -d --no-build
            # Single-file bind mounts pin the file's inode: git checkout replaces
            # a changed file with a NEW inode, so a running container keeps
            # reading the OLD content (`caddy reload` inside it re-reads the old
            # file too), and `up` recreates a service only when its compose
            # definition changed. So when a mounted file changed between the
            # previous and this checkout, recreate just that service (--no-deps
            # leaves api/db alone; caddy: a few seconds of refused connections,
            # certs persist in caddy_data). A failing git diff also recreates.
            if [ -n "$PREV_SHA" ]; then
              for pair in Caddyfile:caddy scripts/backup.sh:backup; do
                if ! git diff --quiet "$PREV_SHA" "$DEPLOY_SHA" -- "${pair%%:*}"; then
                  echo "${pair%%:*} changed: recreating ${pair#*:}"
                  $COMPOSE up -d --no-build --no-deps --force-recreate "${pair#*:}"
                fi
              done
            fi

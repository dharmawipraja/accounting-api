# Rotated json-file logging on every long-running service: without caps the
# log file grows unbounded, and recent history should survive until rotation
# even across `up -d --build` (which discards the previous container's logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '5'

services:
  migrate:
    logging: *default-logging
    # CD sets MIGRATE_IMAGE to the pushed ghcr `-migrate:<sha>` image and runs
    # `compose pull && up -d --no-build`; locally `up --build` builds + tags it.
    image: ${MIGRATE_IMAGE:-accounting-api-migrate:local}
    build:
      context: .
      target: build
    # Schema migrations run as the OWNER (accounting); then the idempotent grants
    # step (re)creates the least-privilege `accounting_app` role the api runs as
    # and grants it DML on every table — including ones this deploy just added.
    command: ['sh', '-c', 'node scripts/db/ensure-app-role.js --check-only && npx prisma migrate deploy && node scripts/db/ensure-app-role.js']
    environment:
      DATABASE_URL: postgresql://accounting:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/accounting?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required (password for the accounting_app DB role)}
      # Only for ensure-app-role's URL-safety check (it is already inside DATABASE_URL).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  api:
    logging: *default-logging
    # CD sets API_IMAGE to the pushed ghcr `:<sha>` image (see migrate above).
    image: ${API_IMAGE:-accounting-api:local}
    init: true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Least privilege: the api connects as `accounting_app` (DML only — no DDL,
      # no TRUNCATE, not the owner). Only `migrate` (and backups) use the owner.
      DATABASE_URL: postgresql://accounting_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required (password for the accounting_app DB role)}@db:5432/accounting?schema=public
      # Caddy -> api is exactly one proxy hop (the base file defaults to 0).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-15}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Only Caddy is published in production: drop the base file's
    # `127.0.0.1:3000:3000` so nothing on the host (or a misconfigured host
    # firewall / SSH tunnel) reaches the api around Caddy's headers, body cap and
    # /ready+/metrics blocking. `!reset` needs Docker Compose >= 2.24.0. The
    # healthcheck probes 127.0.0.1:3000 INSIDE the container, so it is unaffected.
    # Need host access for a smoke/perf run? add -f docker-compose.hostport.yml.
    ports: !reset []
    # Must exceed worst-case drain: active requests are bounded by the 40s
    # socket requestTimeout (idle keep-alive sockets close at shutdown start).
    stop_grace_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M

  caddy:
    logging: *default-logging
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required (public hostname for auto-HTTPS)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    logging: *default-logging
    restart: unless-stopped
    # Not published on the host in production (drops the base file's
    # `127.0.0.1:5432:5432`): api/migrate/backup reach it as `db:5432` on the
    # compose network, and operators use `$COMPOSE exec db psql …`. For a
    # one-off host-side psql add -f docker-compose.hostport.yml.
    ports: !reset []
    # Fresh volume only: the init script creates `accounting_app` + default
    # privileges before the first migration. Existing volumes are covered by the
    # migrate service's idempotent grants step (same SQL).
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required (password for the accounting_app DB role)}
    volumes:
      - ./scripts/db/initdb/10-accounting-app-role.sh:/docker-entrypoint-initdb.d/10-accounting-app-role.sh:ro
      - ./scripts/db/app-role.sql:/docker-entrypoint-app-role.sql:ro
    command:
      - postgres
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'effective_cache_size=1GB'
      - '-c'
      - 'max_connections=50'
      - '-c'
      - 'work_mem=8MB'
      - '-c'
      - 'maintenance_work_mem=128MB'
    deploy:
      resources:
        limits:
          memory: 1536M

  backup:
    logging: *default-logging
    image: postgres:16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: accounting
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: accounting
      RETENTION_DAYS: '7'
      BACKUP_INTERVAL: '86400'
    entrypoint: ['/bin/sh', '/backup.sh']
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backups:/backups
      - backup_metrics:/backup-metrics

  redis:
    logging: *default-logging
    restart: unless-stopped
    # Not published on the host in production (drops the base file's
    # `127.0.0.1:6379:6379`): the api reaches it as `redis:6379`; operators use
    # `$COMPOSE exec redis redis-cli …` (or -f docker-compose.hostport.yml).
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  caddy_data:
  caddy_config:
  backups:
  backup_metrics:

global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # The bearer token is read from an UNTRACKED file (never put it here):
    # monitoring/secrets/metrics_token on the host, mounted read-only by
    # docker-compose.monitoring.yml, holding the same value as the api's
    # METRICS_TOKEN. /metrics is fail-closed in production (the compose api
    # runs NODE_ENV=production): a missing/unreadable file, an unset
    # METRICS_TOKEN or a mismatch all fail the scrape (up == 0 -> ApiDown).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['api:3000']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

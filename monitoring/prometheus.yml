global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # PRODUCTION: METRICS_TOKEN MUST be set on the api and this block MUST be
    # uncommented with the same token. /metrics is fail-closed — unset token in
    # production, or a set token with this block commented, both 401 the
    # scrape and ApiDown fires. Only a non-production stack may leave both off.
    # authorization:
    #   credentials: '<METRICS_TOKEN>'
    static_configs:
      - targets: ['api:3000']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

services:
  db:
    image: postgres:16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: accounting
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accounting']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://accounting:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/accounting?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required (min 32 chars)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      REDIS_URL: redis://redis:6379
      # Optional knobs from .env (defaults mirror the app's own defaults — a
      # numeric/enum var must never arrive as '': startup validation rejects it).
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-10}
      THROTTLE_LOGIN_IP_LIMIT: ${THROTTLE_LOGIN_IP_LIMIT:-30}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-20}
      LOGIN_FAILURE_HARD_LIMIT: ${LOGIN_FAILURE_HARD_LIMIT:-100}
      THROTTLE_REFRESH_LIMIT: ${THROTTLE_REFRESH_LIMIT:-30}
      REFRESH_REUSE_GRACE_MS: ${REFRESH_REUSE_GRACE_MS:-5000}
      THROTTLE_CHANGE_PASSWORD_LIMIT: ${THROTTLE_CHANGE_PASSWORD_LIMIT:-10}
      THROTTLE_CORETAX_EXPORT_LIMIT: ${THROTTLE_CORETAX_EXPORT_LIMIT:-10}
      ARGON2_MAX_CONCURRENCY: ${ARGON2_MAX_CONCURRENCY:-8}
      # This base file publishes the api directly (no Caddy in front), so no
      # proxy hop is trusted: a client-sent X-Forwarded-For must not set req.ip.
      # docker-compose.prod.yml (Caddy -> api = one hop) defaults it to 1.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-35000}
      REPORT_UTC_OFFSET_MINUTES: ${REPORT_UTC_OFFSET_MINUTES:-420}
      IDEMPOTENCY_INFLIGHT_TTL_MS: ${IDEMPOTENCY_INFLIGHT_TTL_MS:-120000}
      IDEMPOTENCY_COMPLETED_TTL_MS: ${IDEMPOTENCY_COMPLETED_TTL_MS:-86400000}
      # Enum-validated at startup: '' would be rejected, so default explicitly.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Empty-means-off vars (an unset operator value arrives as ''):
      #   CORS_ORIGIN ''  -> CORS disabled (fail-closed; no browser origin allowed)
      #   METRICS_TOKEN '' -> /metrics fail-closed 401 in production
      #   SENTRY_DSN ''   -> Sentry disabled; SENTRY_ENVIRONMENT/RELEASE '' -> NODE_ENV / no release
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
